# Режим демонстрации: доступ из интернета по HTTPS и ссылке-приглашению (NFR-008, CR-2026-004).
# Подключается поверх основного файла (и GPU-файла):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.public.yml up -d --build
# На роутере пробрасываются только TCP 80 и 443 на этот ПК. Порт API наружу не открывается.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Укажите PUBLIC_DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты сохраняются между перезапусками: повторный выпуск упирается в лимиты центра сертификации
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  api:
    <<: *hardening
    # Только этот ПК: метрики и /invite открываются по http://localhost:8000, снаружи всё идёт через Caddy
    ports: !override
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      ACCESS_KEY: ${ACCESS_KEY:?Укажите ACCESS_KEY в .env}
      PUBLIC_URL: https://${PUBLIC_DOMAIN}

  worker:
    <<: *hardening

  redis:
    <<: *hardening
    # Redis ничего не пишет на диск (--save ""), поэтому может работать без root и только на чтение
    user: redis

volumes:
  caddy_data:
  caddy_config:

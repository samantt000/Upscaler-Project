# Запуск (CPU):  docker compose up -d --build
# Запуск (GPU):  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
name: upscaler

services:
  redis:
    image: redis:7.2-alpine
    # Очередь и состояние задач в памяти: данные не переживают перезапуск, и это намеренно (FR-010)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    image: upscaler-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # NFR-008: по умолчанию сервис доступен с этого ПК и из локальной сети
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8000}:8000"
    environment: &common-env
      # Местное время в журналах и CSV результатов (иначе контейнер пишет по UTC, на 3 ч меньше)
      TZ: ${TZ:-Europe/Kirov}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      RETENTION_SECONDS: ${RETENTION_SECONDS:-86400}
      BRISQUE_BASELINE: ${BRISQUE_BASELINE:-}
      BRISQUE_DRIFT_MIN_JOBS: ${BRISQUE_DRIFT_MIN_JOBS:-10}
    volumes:
      - jobs:/data

  worker:
    build:
      context: ./worker
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    image: upscaler-worker:cpu
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      DEVICE: ${DEVICE:-auto}
      TILE_SIZE: ${TILE_SIZE:-256}
      TORCH_THREADS: ${TORCH_THREADS:-0}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-600}
      FACE_DETAIL_REDUCTION: ${FACE_DETAIL_REDUCTION:-0.5}
    volumes:
      - jobs:/data

  # Нагрузочный тест (NFR-001, NFR-003). Не запускается с сайтом, только по команде:
  #   docker compose run --rm loadtest --headless -u 5 -r 5 -t 25m --csv results/nfr001_gpu
  loadtest:
    build: ./loadtest
    image: upscaler-loadtest
    profiles: ["loadtest"]
    depends_on:
      - api
    working_dir: /work
    volumes:
      - ./loadtest:/work/loadtest:ro
      - ./results:/work/results
    environment:
      TZ: ${TZ:-Europe/Kirov}
      LOAD_IMAGE: ${LOAD_IMAGE:-}
      LOAD_SCALE: ${LOAD_SCALE:-4}

volumes:
  # Имя «jobs» (раньше «data»): новый том создаётся с владельцем app, процессы работают не от root
  jobs:
